[project]
name = "cw-biap"
version = "0.1.0"
description = "BIAP coursework: ballistic design of a three-stage solid-fuel rocket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cma>=4.4.4",
    "matplotlib>=3.11.0",
    "numpy>=2.0",
    "pandas>=3.0.3",
    "pandas-stubs>=3.0.3.260530",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["main.py", "preliminary.py", "utils.py", "typst.py", "traj"]
exclude = ["**/__pycache__", ".venv", "outcmaes", "traj/out", "openfoam"]
